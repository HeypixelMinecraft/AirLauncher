# AirLauncher CI
#
# 每次 push / PR 在 Windows 上完整构建一次 NSIS 安装包并上传为构建产物；
# 打 tag（v*）时额外把安装包挂到对应的 GitHub Release 上。
#
# 注意：
# - 必须用 windows-latest：Tauri 打包 NSIS、链接 MSVC 都依赖 Windows 工具链。
# - 不要改成 --no-default-features 之类，前端 build 是 tauri.conf.json 里的
#   beforeBuildCommand（clean-build.mjs + vite build），必须由 tauri build 触发。
# - 缓存放 Swatinem/rust-cache，target 目录 1GB+，冷构建约 10 分钟，热缓存 3~4 分钟。

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次未完成的构建，省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 构建产物名里不要带奇怪的字符，tag 直接用 ref_name
  ARTIFACT_NAME: AirLauncher-${{ github.ref_name }}-${{ github.sha }}

jobs:
  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    permissions:
      # tag 推送时需要创建 / 更新 Release 并上传附件
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          # lockfileVersion 9.0，pnpm 10 可直接读取
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo.toml 在子目录里，必须显式告诉缓存插件 target 在哪
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查
        run: pnpm check

      - name: 构建（Tauri build + NSIS 打包）
        run: pnpm tauri build

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          # 打包失败时宁可让 CI 红，也不要产出一个空 artifact
          if-no-files-found: error
          retention-days: 14

      - name: 挂到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release 不存在就先建（--generate-notes 用提交记录自动生成更新说明）
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes --draft=false
          gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber
